<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVibe - Music Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-compact-disc"></i>
                <h2>StreamVibe</h2>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#"><i class="fas fa-search"></i> Search</a></li>
                <li><a href="#"><i class="fas fa-book-open"></i> Your Library</a></li>
                <li class="nav-admin"><a href="admin.html"><i class="fas fa-cog"></i> Admin Panel</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search for songs, artists, or albums...">
                </div>
            </header>

            <div class="content-area">
                <h2>All Songs</h2>
                <div id="loading" class="loading">Loading songs...</div>
                <div id="songsGrid" class="songs-grid">
                    <!-- Songs will be injected here dynamically -->
                </div>
            </div>
        </main>

        <!-- Player Bar -->
        <div class="player-bar">
            <div class="now-playing">
                <img id="playerCover" src="https://via.placeholder.com/60" alt="Cover" class="hidden">
                <div class="track-info hidden" id="playerInfo">
                    <h4 id="playerTitle">Song Title</h4>
                    <p id="playerArtist">Artist Name</p>
                </div>
            </div>

            <div class="player-controls">
                <div class="buttons">
                    <button id="prevBtn" class="control-btn"><i class="fas fa-step-backward"></i></button>
                    <button id="playBtn" class="play-btn"><i class="fas fa-play"></i></button>
                    <button id="nextBtn" class="control-btn"><i class="fas fa-step-forward"></i></button>
                </div>
                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar-wrapper" id="progressWrapper">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="volume-controls">
                <i class="fas fa-volume-up" id="muteIcon"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            </div>
            <audio id="audioPlayer"></audio>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
